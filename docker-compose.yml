services:
  converter-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    environment:
      MODEL_TYPE: ${MODEL_TYPE:-gec}
      HF_MODEL_NAME: ${HF_MODEL_NAME:-}
      HF_TOKEN: ${HF_TOKEN:-}
      QUANTIZATION: ${QUANTIZATION:-q4_k_m}
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      OUTPUT_DIR: /output
    volumes:
      - type: bind
        source: ${HOST_CACHE_DIR:-./cache/huggingface}
        target: /cache/huggingface
      - type: bind
        source: ${HOST_OUTPUT_DIR:-./output}
        target: /output
    profiles: [cpu]

  converter-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      MODEL_TYPE: ${MODEL_TYPE:-gec}
      HF_MODEL_NAME: ${HF_MODEL_NAME:-}
      HF_TOKEN: ${HF_TOKEN:-}
      QUANTIZATION: ${QUANTIZATION:-q4_k_m}
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      OUTPUT_DIR: /output
    volumes:
      - type: bind
        source: ${HOST_CACHE_DIR:-./cache/huggingface}
        target: /cache/huggingface
      - type: bind
        source: ${HOST_OUTPUT_DIR:-./output}
        target: /output
    gpus: all
    profiles: [gpu]
